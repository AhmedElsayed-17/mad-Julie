<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soulmate Question</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #ffe6e9;
      font-family: Arial, sans-serif;
    }

    .main-frame {
      background: #ffffff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 500px;
      width: 90%;
      position: relative;
    }

    .question {
      font-size: 22px;
      font-weight: bold;
      color: #333333;
      margin-bottom: 25px;
    }

    /* Picture is hidden initially */
    .cat-img {
      width: 180px;
      height: auto;
      border-radius: 10px;
      margin-top: 15px;
      margin-bottom: 20px;
      display: none;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 25px;
      position: relative;
      min-height: 50px;
    }

    button {
      padding: 10px 25px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    #yes-btn {
      background-color: #ff4d6d;
      color: white;
    }

    #no-btn {
      background-color: #6c757d;
      color: white;
      position: absolute;
    }

    .disclaimer {
      font-size: 22px;
      color: #666666;
      margin-top: 20px;
      border-top: 1px solid #eee;
      padding-top: 15px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="main-frame">
    <div class="question">
      Your serious thinking time is over. Do you admit that HerBolBol is the best soulmate you have ever met?
    </div>

    <div class="btn-container">
      <button id="yes-btn" onclick="showImage()">Yes</button>
      <button id="no-btn">No</button>
    </div>

    <!-- Image reveals when Yes is pressed -->
    <img id="cat-image" src="cat.jpg" alt="Cute Cat" class="cat-img">

    <div class="disclaimer">
      Disclaimer: If you are still mad at my goofy personality, this message was sent by my neighbor's cockroaches—they hacked my system.
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('no-btn');
    const container = document.querySelector('.btn-container');
    const catImage = document.getElementById('cat-image');

    // Reveal image on clicking YES
    function showImage() {
      catImage.style.display = 'inline-block';
    }

    // Make the NO button move randomly on hover/touch
    noBtn.addEventListener('mouseover', moveButton);
    noBtn.addEventListener('touchstart', moveButton);

    function moveButton() {
      const containerRect = container.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      const maxX = containerRect.width - btnRect.width;
      const maxY = 150;

      const randomX = Math.floor(Math.random() * maxX);
      const randomY = Math.floor(Math.random() * maxY) - 50;

      noBtn.style.left = `${randomX}px`;
      noBtn.style.top = `${randomY}px`;
    }
  </script>

</body>
</html>
